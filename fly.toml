# Fly.io: `fly launch --copy-config --no-deploy` then `fly deploy`
app = "linebreak"
primary_region = "nrt"

[build]

[http_service]
  internal_port = 8787
  force_https = true
  # rooms live in memory: keep exactly one machine running
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "5s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "3s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
