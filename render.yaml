# Render Blueprint: Dashboard > New > Blueprint > pick this repository > Apply.
# The game is then live at https://<name>.onrender.com and invites look like /room/AB12CD.
services:
  - type: web
    name: linebreak
    runtime: docker
    # free: sleeps after ~15 min without traffic (first visit then takes ~1 min, idle rooms are lost).
    # starter: always on. Switch here or in the dashboard.
    plan: free
    healthCheckPath: /healthz
    numInstances: 1
    autoDeploy: true
